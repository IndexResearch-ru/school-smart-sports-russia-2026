<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" fill="#fff"/><text x="60" y="55" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Что значит «думать во время движения»</text><rect x="70" y="130" width="210" height="90" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/><text x="175" y="168" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">Восприятие</text><text x="175" y="198" font-family="Arial" font-size="15" text-anchor="middle" fill="#475569">карта / соперник / среда</text><rect x="360" y="130" width="210" height="90" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/><text x="465" y="168" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">Прогноз</text><text x="465" y="198" font-family="Arial" font-size="15" text-anchor="middle" fill="#475569">что произойдет дальше</text><rect x="650" y="130" width="210" height="90" rx="15" fill="#ecfdf5" stroke="#5eead4"/><text x="755" y="168" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#134e4a">Выбор</text><text x="755" y="198" font-family="Arial" font-size="15" text-anchor="middle" fill="#134e4a">маршрут / действие</text><rect x="940" y="130" width="190" height="90" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1035" y="168" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">Движение</text><text x="1035" y="198" font-family="Arial" font-size="15" text-anchor="middle" fill="#475569">реализация решения</text><line x1="285" y1="175" x2="350" y2="175" stroke="#0f766e" stroke-width="4"/><polygon points="350,175 336,167 336,183" fill="#0f766e"/><line x1="575" y1="175" x2="640" y2="175" stroke="#0f766e" stroke-width="4"/><polygon points="640,175 626,167 626,183" fill="#0f766e"/><line x1="865" y1="175" x2="930" y2="175" stroke="#0f766e" stroke-width="4"/><polygon points="930,175 916,167 916,183" fill="#0f766e"/><text x="60" y="315" font-family="Arial" font-size="27" font-weight="700" fill="#111827">Граница вывода</text><text x="80" y="370" font-family="Arial" font-size="20" fill="#334155">Рейтинг оценивает когнитивную насыщенность спортивной задачи, а не интеллект ребенка.</text><text x="80" y="410" font-family="Arial" font-size="20" fill="#334155">Научные данные не используются как обещание повысить IQ или школьные оценки.</text><text x="80" y="450" font-family="Arial" font-size="20" fill="#334155">Высокое место означает соответствие сценарию «физическая нагрузка + решения в движении».</text></svg>